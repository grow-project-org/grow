codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "60...100"
  status:
    project:
      default:
        target: 60%
        threshold: 1%
        flags:
          - backend
    patch:
      default:
        target: 80%
        flags:
          - backend

flags:
  backend:
    paths:
      - backend/
    carryforward: false

comment:
  layout: "header, diff, flags, files, footer"
  behavior: default
  require_changes: false
  show_carryforward_flags: true

github_checks:
  annotations: true

ignore:
  - "backend/**/Migrations/**"
  - "backend/Grow.WebApi/Program.cs"
  - "backend/Grow.Tests.Unit/**"
  - "backend/Grow.Tests.Integration/**"
