name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:

defaults:
  run:
    working-directory: backend

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Grow.slnx

      - name: Build
        run: dotnet build Grow.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Grow.slnx --configuration Release --no-build
